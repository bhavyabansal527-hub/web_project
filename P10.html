
<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Portfolio</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
    color: white;
    padding: 20px 40px;
}

.header nav {
    display: flex;
    gap: 25px;
}

.header nav a {
    color: white;
    text-decoration: none;
}

main {
    flex: 1;
    text-align: center;
    padding: 60px 20px;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #cb2929;
    color: white;
    padding: 20px 40px;
}

.social-links {
    display: flex;
    gap: 20px;
}

.social-links a {
    color: white;
    text-decoration: none;
}
</style>
</head>
<body>

    <header class="header">
        <h2>My Portfolio</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Portfolio</h1>
        <p>Web Development Student</p>
    </main>

    <footer class="footer">
        <p>© 2026 My Portfolio.</p>
    </footer>

</body>
</html>
