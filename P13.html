
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox and Grid Layout</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

header {
    background-color: #842323;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav {
    display: flex;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

main {
    padding: 30px;
    text-align: center;
}

.project-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 25px;
}

.card {
    background-color: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 5px gray;
}

.card h3 {
    margin-bottom: 10px;
}
</style>
</head>
<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>My Projects</h1>

        <section class="project-grid">
            <div class="card">
                <h3>Project 1</h3>
                <p>HTML Website</p>
            </div>

            <div class="card">
                <h3>Project 2</h3>
                <p>CSS Design</p>
            </div>

            <div class="card">
                <h3>Project 3</h3>
                <p>Web Development</p>
            </div>
        </section>
    </main>

</body>
</html>
